<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 740" width="1010" height="740" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">AntKart platform architecture: Clean Architecture rings</title>
<desc id="d">Four concentric rings. Domain at the core holds the Order, Cart, Payment and Coupon entities, value objects, status enums, domain events and specifications, with no framework dependencies. Application surrounds it with command and query handlers, saga state machines, message consumers, validators and the repository interfaces the core owns. Infrastructure holds EF Core persistence, Cosmos DB, Redis and Service Bus adapters, external clients, resilience policies and health checks. API is outermost with minimal API endpoints, Ocelot gateway routing, the gRPC discount contract and Azure Functions triggers. Dependencies point inward only.</desc>
<rect width="1010" height="740" fill="#ffffff"/>
<text x="40" y="48" font-size="27" font-weight="600" fill="#2C2C2A">AntKart under Clean Architecture</text>
<text x="40" y="75" font-size="15" fill="#5F5E5A">The core knows nothing about the database, the message broker, or HTTP. Every service is built this way.</text>
<circle cx="300" cy="392" r="252" fill="#7F77DD"/>
<circle cx="300" cy="392" r="194" fill="#185FA5"/>
