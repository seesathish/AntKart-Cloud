<text x="300" y="386" font-size="17" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="1.6">DOMAIN</text>
<text x="300" y="412" font-size="13" fill="#ffffff" text-anchor="middle" opacity="0.85">the core</text>
