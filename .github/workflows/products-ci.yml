# =============================================================================
# Products CI — pull-request quality gate
# =============================================================================
# This is the CI half of the two-workflow, per-service pattern (ADR-023).
# It runs ONLY on pull requests that touch the Products service (or the shared
# code / tests that affect it) and is a PURE QUALITY GATE: build, test with
# coverage, static analysis (SonarCloud), and security scan (Trivy).
#
# It deliberately does NOT build or push a container image and does NOT deploy —
# delivery is a separate CD workflow that runs on merge to master, updates the
# image tag in Git, and lets Argo CD reconcile the cluster (see the DevOps CI/CD
# Guide). CI never runs helm/kubectl and holds no cluster credentials.
#
# Templating note: this file is the reference pattern for one service. The other
# services get a copy with the paths, project names, and project key adjusted.
# =============================================================================

name: Products CI

# --- Triggers -----------------------------------------------------------------
# Path-filtered so a change to another service does not run this pipeline:
#   * AK.Products/**        — the service itself
#   * AK.BuildingBlocks/**  — the shared library every service compiles against
#   * AK.IntegrationTests/**— the in-memory integration tests that exercise
#                             Products (and related) flows
#   * nuget.config          — restore behaviour (package sources) affects the build
#   * this workflow file    — so changes to the gate are validated by the gate
on:
  pull_request:
    branches: [ master ]
    paths:
      - 'AK.Products/**'
      - 'AK.BuildingBlocks/**'
      - 'AK.IntegrationTests/**'
      - 'nuget.config'
      - '.github/workflows/products-ci.yml'
      # Documentation-only changes inside a service folder (e.g. *.md) do NOT
      # trigger the CI gate. The negation must be LAST — later patterns win in
      # GitHub Actions path filters.
      - '!**/*.md'

# Least privilege: the gate only needs to read the repository. It never writes to
# Git, the registry, or the cluster (that is CD's concern, with its own scoped
# OIDC identity). Trivy fails the job via exit code rather than uploading SARIF,
# so no `security-events: write` is needed.
permissions:
  contents: read

# Cancel an in-progress run for a PR when a new commit is pushed to it.
concurrency:
  group: products-ci-${{ github.ref }}
  cancel-in-progress: true

# --- Shared configuration -----------------------------------------------------
env:
  # .NET SDK — pinned to the repository's target framework (net9.0; every real
  # project sets <TargetFramework>net9.0</TargetFramework>, and there is no
  # global.json). 9.0.x tracks the latest 9.0 SDK patch.
  DOTNET_VERSION: '9.0.x'

  # The deployable project (compile-checked so a broken API build fails the gate)
  PRODUCTS_API: 'AK.Products/AK.Products.API/AK.Products.API.csproj'
  # Test projects run in CI — both need only in-memory infrastructure:
  PRODUCTS_TESTS: 'AK.Products/AK.Products.Tests/AK.Products.Tests.csproj'
  INTEGRATION_TESTS: 'AK.IntegrationTests/AK.IntegrationTests.csproj'

  # SonarCloud coordinates. The project key is the repository-level SonarCloud
  # project (org convention <org>_<repo>); adjust if the actual key differs.
  SONAR_ORG: 'seesathish'
  SONAR_PROJECT_KEY: 'seesathish_AntKart-Src3'

  # Trivy failure threshold — the single knob for the security gate. Any finding
  # at or above these severities fails the job.
  TRIVY_SEVERITY: 'HIGH,CRITICAL'

# NOTE (ADR-022 supply chain): third-party Actions below are pinned to an
# immutable commit SHA (a tag can be repointed, a SHA cannot), with the release
# version as a trailing comment for readability. When bumping an action, look up
# the SHA the new release tag points to and update both the SHA and the comment.

jobs:
  # ===========================================================================
  # Stage 1 — build & test (the fast gate: compile + both test tiers)
  # ===========================================================================
  build-test:
    name: build-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Restore against the repo-root nuget.config (which clears the private
      # Azure DevOps feed and uses nuget.org only — see CLAUDE.md). Restoring the
      # test projects also restores the Products app graph and BuildingBlocks
      # (transitive project references); the API is restored explicitly so the
      # deployable is compiled too.
      - name: Restore
        run: |
          dotnet restore "${{ env.PRODUCTS_API }}"
          dotnet restore "${{ env.PRODUCTS_TESTS }}"
          dotnet restore "${{ env.INTEGRATION_TESTS }}"

      # Build the deployable in Release; a compile error here fails the gate.
      - name: Build (Release)
        run: dotnet build "${{ env.PRODUCTS_API }}" -c Release --no-restore

      # Unit tests — pure, no infrastructure. Coverage is collected as OpenCover
      # (the format SonarCloud consumes natively for .NET via
      # sonar.cs.opencover.reportsPaths) using the coverlet.collector already
      # referenced by the test projects.
      - name: Unit tests (AK.Products.Tests)
        run: >
          dotnet test "${{ env.PRODUCTS_TESTS }}" -c Release
          --collect:"XPlat Code Coverage;Format=opencover"
          --results-directory ./coverage
          --logger "trx;LogFileName=products-unit.trx"

      # In-memory integration tests — the MassTransit in-memory harness (no
      # broker, no database, no running host), so they are safe in CI.
      - name: Integration tests (AK.IntegrationTests)
        run: >
          dotnet test "${{ env.INTEGRATION_TESTS }}" -c Release
          --collect:"XPlat Code Coverage;Format=opencover"
          --results-directory ./coverage
          --logger "trx;LogFileName=integration.trx"

      # Keep coverage + test results for inspection on the PR run.
      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: products-test-results
          path: |
            ./coverage/**/*.xml
            ./coverage/**/*.trx
          if-no-files-found: warn

  # ===========================================================================
  # Stage 2 — SonarCloud static analysis + coverage
  # ===========================================================================
  # SonarScanner for .NET instruments the build via an MSBuild "begin ... build
  # ... end" wrapper, so it must run its own build (it cannot analyse a prebuilt
  # output). It runs after build-test so Sonar is not spent on a commit that
  # already fails to compile or test.
  sonar:
    name: sonar
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      # Full history: SonarCloud uses it for accurate new-code / blame data.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # SonarScanner for .NET runs on the JVM; Java 17+ is required.
      - name: Set up Java (for the Sonar scanner)
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: 'temurin'
          java-version: '17'

      # Cache the SonarCloud analysis cache and the globally-installed scanner.
      - name: Cache SonarCloud packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Install dotnet-sonarscanner
        run: dotnet tool install --global dotnet-sonarscanner

      # begin -> build -> test(with coverage) -> end. Everything MSBuild-built
      # between begin and end is analysed; the OpenCover reports produced by the
      # test runs are wired in via sonar.cs.opencover.reportsPaths so SonarCloud
      # shows real coverage.
      #
      # SONAR_TOKEN is a GitHub Actions secret (no cloud credential). Same-repo
      # PRs have it; PRs from forks do not receive secrets — that fork case is a
      # documented consideration in the DevOps CI/CD Guide.
      - name: SonarCloud analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet sonarscanner begin \
            /k:"${{ env.SONAR_PROJECT_KEY }}" \
            /o:"${{ env.SONAR_ORG }}" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" \
            /d:sonar.coverage.exclusions="**/Program.cs,**/Logging/SerilogExtensions.cs,**/Observability/OpenTelemetryExtensions.cs,**/Persistence/MongoDbContext.cs"

          dotnet build "${{ env.PRODUCTS_API }}" -c Release
          dotnet build "${{ env.PRODUCTS_TESTS }}" -c Release
          dotnet build "${{ env.INTEGRATION_TESTS }}" -c Release

          dotnet test "${{ env.PRODUCTS_TESTS }}" -c Release --no-build \
            --collect:"XPlat Code Coverage;Format=opencover" \
            --results-directory ./coverage
          dotnet test "${{ env.INTEGRATION_TESTS }}" -c Release --no-build \
            --collect:"XPlat Code Coverage;Format=opencover" \
            --results-directory ./coverage

          # AK.BuildingBlocks.Tests coverage — the per-service jobs otherwise never run it,
          # so shared-library code (e.g. middleware) would show 0% on new code in Sonar.
          dotnet build "AK.BuildingBlocks/AK.BuildingBlocks.Tests/AK.BuildingBlocks.Tests.csproj" -c Release
          dotnet test "AK.BuildingBlocks/AK.BuildingBlocks.Tests/AK.BuildingBlocks.Tests.csproj" -c Release --no-build --collect:"XPlat Code Coverage;Format=opencover" --results-directory ./coverage

          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

  # ===========================================================================
  # Stage 3 — Trivy security scan (dependencies/filesystem + Dockerfile)
  # ===========================================================================
  # Independent of build-test (it scans source, not build output), so it runs in
  # parallel as its own distinct gate stage.
  trivy:
    name: trivy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # (1) Filesystem / dependency scan of the Products service tree: vulnerable
      # dependencies, leaked secrets, and IaC/Dockerfile misconfiguration. Fails
      # the job (exit-code 1) on any finding at TRIVY_SEVERITY or above.
      - name: Trivy filesystem/dependency scan (AK.Products)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: 'AK.Products'
          scanners: 'vuln,secret,misconfig'
          severity: ${{ env.TRIVY_SEVERITY }}
          exit-code: '1'
          ignore-unfixed: 'false'   # set 'true' to ignore vulns with no fix yet

      # (2) Dedicated Dockerfile misconfiguration scan of the Products image build.
      - name: Trivy Dockerfile scan (Products)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'config'
          scan-ref: 'AK.Products/AK.Products.API/Dockerfile'
          severity: ${{ env.TRIVY_SEVERITY }}
          exit-code: '1'
